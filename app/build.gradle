plugins {
    id "com.android.application"
}

android {
    namespace "com.signalbox.jellyremote"
    compileSdk 35

    defaultConfig {
        applicationId "com.signalbox.jellyremote"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // Personal sideload build: installable, but not runtime-debuggable.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
