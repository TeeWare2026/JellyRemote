plugins {
    id "com.android.application"
}

android {
    namespace "com.signalbox.jellyremote"
    compileSdk 35

    defaultConfig {
        applicationId "com.signalbox.jellyremote"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
        testInstrumentationRunner "com.signalbox.jellyremote.LibrarySmokeTest"
    }

    buildTypes {
        release {
            // Personal sideload build: installable, but not runtime-debuggable.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
}
